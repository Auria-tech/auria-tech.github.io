name: Deploy site

on:
  push:
    branches: [main]
  # Lets us re-publish from the Actions tab without an empty commit.
  workflow_dispatch:

# Read the repo, write a Pages deployment, mint the OIDC token Pages requires.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a newer push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
